<div class="routine-editor" *ngIf="household.members().length; else noMembers">
  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>Person</mat-label>
      <mat-select [ngModel]="memberId()" (ngModelChange)="select($event)">
        <mat-option *ngFor="let member of household.members()" [value]="member.id">{{ member.name }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Is a</mat-label>
      <mat-select [(ngModel)]="kind">
        <mat-option value="">Not tracked</mat-option>
        <mat-option value="child">Child (school days)</mat-option>
        <mat-option value="adult">Adult (work days)</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <ng-container *ngIf="kind === 'child'">
    <span class="field-label">School days</span>
    <div class="weekday-picker">
      <button *ngFor="let label of weekdayLabels; let day = index" type="button" class="weekday-chip"
        [class.selected]="days('schoolDays').includes(day)" (click)="toggleDay('schoolDays', day)">{{ label }}</button>
    </div>
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Regular drop-off time</mat-label>
        <input matInput type="time" [(ngModel)]="routine.dropOffTime">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Regular pick-up time</mat-label>
        <input matInput type="time" [(ngModel)]="routine.pickUpTime">
      </mat-form-field>
      <mat-form-field appearance="outline" *ngIf="routine.schoolMeals">
        <mat-label>School lunch</mat-label>
        <mat-select [(ngModel)]="routine.schoolMeals.lunch">
          <mat-option [value]="undefined">Not set</mat-option>
          <mat-option value="hot">Hot lunch</mat-option>
          <mat-option value="pack">Packed lunch</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </ng-container>

  <ng-container *ngIf="kind === 'adult'">
    <span class="field-label">Work days</span>
    <div class="weekday-picker">
      <button *ngFor="let label of weekdayLabels; let day = index" type="button" class="weekday-chip"
        [class.selected]="days('workDays').includes(day)" (click)="toggleDay('workDays', day)">{{ label }}</button>
    </div>
    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>Usual start time</mat-label>
        <input matInput type="time" [(ngModel)]="routine.workStartTime">
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Usual stop time</mat-label>
        <input matInput type="time" [(ngModel)]="routine.workStopTime">
      </mat-form-field>
    </div>
  </ng-container>

  <div class="actions">
    <button mat-raised-button color="primary" [disabled]="isSaving()" (click)="save()">Save routine</button>
  </div>
</div>
<ng-template #noMembers><p class="hint-text">Add a family member above to set up their routine.</p></ng-template>
