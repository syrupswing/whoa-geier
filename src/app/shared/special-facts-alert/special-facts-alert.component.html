<div class="special-facts" *ngIf="lines() as items">
  <ng-container *ngIf="items.length">
    <mat-icon class="special-icon">campaign</mat-icon>
    <div class="special-body">
      <strong>Don't forget today</strong>
      <ul>
        <li *ngFor="let line of items; trackBy: trackById"><b>{{ line.who }}:</b> {{ line.text }}</li>
      </ul>
    </div>
  </ng-container>
</div>
