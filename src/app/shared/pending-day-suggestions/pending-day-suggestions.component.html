<div class="pending-day-suggestions" *ngIf="detection.pending().length">
  <div class="pending-card" *ngFor="let s of detection.pending(); trackBy: trackByKey">
    <mat-icon class="pending-icon">event_available</mat-icon>
    <div class="pending-body">
      <strong class="pending-heading">Calendar event “{{ s.summary }}” on {{ when(s) }}</strong>
      <div class="pending-actions">
        <button mat-flat-button color="primary" type="button" (click)="detection.accept(s.key)">{{ confirmLabel(s) }}</button>
        <button mat-stroked-button type="button" (click)="detection.dismiss(s.key)">{{ s.kind === 'fact' ? 'Disregard' : 'Disregard schedule change' }}</button>
      </div>
    </div>
  </div>
</div>
