<button
  mat-icon-button
  class="global-nav-btn"
  [class.stuck]="stuck()"
  [style.top.px]="stuck() ? stuckTop() : null"
  [style.left.px]="stuck() ? stuckLeft() : null"
  matTooltip="Open menu"
  (click)="drawer.toggle()"
  [attr.aria-expanded]="drawer.isOpen()"
  aria-label="Open navigation menu">
  <mat-icon>menu</mat-icon>
</button>
