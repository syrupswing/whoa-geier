<!-- Loading state -->
<div *ngIf="authService.isLoading()" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  <app-loading-animation [size]="96"></app-loading-animation>
</div>

<!-- Show login page without chrome when not authenticated -->
<div *ngIf="!authService.isAuthenticated() && !authService.isLoading()" class="login-container">
  <router-outlet></router-outlet>
</div>

<!-- Show main app when authenticated and not loading -->
<div class="app-container" *ngIf="authService.isAuthenticated() && !authService.isLoading()">
  <div class="content">
    <router-outlet></router-outlet>
  </div>
  
  <!-- Floating AI Chat -->
  <div class="floating-chat" *ngIf="showChat()" [@slideUp]>
    <div class="chat-header">
      <img src="assets/icons/sparkle.svg" alt="AI" class="chat-header-icon">
      <h3>AI Assistant</h3>
      <button mat-icon-button (click)="clearChat()" *ngIf="chatMessages().length > 0" matTooltip="Clear chat">
        <mat-icon>delete_sweep</mat-icon>
      </button>
      <button mat-icon-button (click)="toggleChat()" class="close-btn" matTooltip="Close">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    
    <div class="chat-body" #floatingChatContainer>
      <div *ngIf="chatMessages().length === 0" class="chat-empty">
        <mat-icon>chat_bubble_outline</mat-icon>
        <p>Start a conversation!</p>
        <p class="subtitle">Ask about meal planning, schedules, or organizing tips</p>
      </div>
      
      <div *ngFor="let message of chatMessages()" 
           class="chat-message"
           [class.user-message]="message.isUser"
           [class.ai-message]="!message.isUser">
        <div class="message-content">
          <mat-icon class="message-icon">{{ message.isUser ? 'person' : 'smart_toy' }}</mat-icon>
          <div class="message-text" *ngIf="message.isUser">{{ message.text }}</div>
          <div class="message-text" *ngIf="!message.isUser" [appTypewriter]="message.text"></div>
        </div>
        <div class="message-time">{{ message.timestamp | date:'shortTime' }}</div>
      </div>
      
      <div *ngIf="isChatLoading()" class="chat-message ai-message loading">
        <div class="message-content">
          <mat-icon class="message-icon">smart_toy</mat-icon>
          <div class="message-text">
            <app-loading-animation [size]="20"></app-loading-animation>
            Thinking...
          </div>
        </div>
      </div>
    </div>
    
    <div class="chat-footer">
      <mat-form-field appearance="outline" class="chat-input-field">
        <input 
          matInput 
          [(ngModel)]="chatInput"
          (keyup.enter)="sendChatMessage()"
          placeholder="Type your message..."
          [disabled]="isChatLoading()">
      </mat-form-field>
      <button 
        mat-mini-fab 
        color="primary" 
        (click)="sendChatMessage()"
        [disabled]="!chatInput.trim() || isChatLoading()">
        <mat-icon>send</mat-icon>
      </button>
    </div>
  </div>
  
  <!-- Chat Toggle Button (hidden for now) -->
  <!-- <button 
    mat-fab 
    class="chat-toggle-btn"
    (click)="toggleChat()"
    [class.chat-open]="showChat()"
    matTooltip="AI Assistant">
    <img src="assets/icons/sparkle.svg" alt="AI" class="toggle-icon">
  </button> -->
</div>
