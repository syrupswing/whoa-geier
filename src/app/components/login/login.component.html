<div class="login-container">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>
        <mat-icon>family_restroom</mat-icon>
        Whoa Geier Sign In
      </mat-card-title>
      <mat-card-subtitle>
        Sign in to your account
      </mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form (ngSubmit)="onSubmit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input 
            matInput 
            type="email" 
            [(ngModel)]="email" 
            name="email"
            [disabled]="isLoading()"
            required>
          <mat-icon matPrefix>email</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Password</mat-label>
          <input 
            matInput 
            type="password" 
            [(ngModel)]="password" 
            name="password"
            [disabled]="isLoading()"
            required>
          <mat-icon matPrefix>lock</mat-icon>
        </mat-form-field>

        <div class="error-message" *ngIf="errorMessage()">
          <mat-icon>error</mat-icon>
          {{ errorMessage() }}
        </div>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="full-width"
          [disabled]="isLoading()">
          <app-loading-animation *ngIf="isLoading()" [size]="20"></app-loading-animation>
          <span *ngIf="!isLoading()">Sign In</span>
        </button>
      </form>
    </mat-card-content>
  </mat-card>
</div>
