<div class="settings-container">
  <div class="header">
    <h1>Settings</h1>
    <app-global-nav-menu></app-global-nav-menu>
  </div>

  <!-- General: applies to everyone, or to this device -->
  <h2 class="section-heading">General</h2>
  <mat-card class="form-card">
    <mat-card-content>
      <dl class="setting-list">
        <app-setting-row label="Notifications" [value]="notificationStatus()" [editable]="false"
          hint="Push notifications deliver Remi's morning briefing and family reminders to this device.">
          <button action mat-stroked-button color="primary" type="button"
            *ngIf="pushNotificationService.isSupported() && pushNotificationService.permissionState() === 'default'"
            (click)="enableNotifications()" [disabled]="isRequestingPermission()">
            Enable
          </button>
        </app-setting-row>

        <app-setting-row #homeRow label="Home address" [value]="homeLocation.address()" [saving]="isSavingHome()"
          hint="The starting point for drive times to calendar events that have a location."
          (editStart)="homeAddressDraft = homeLocation.address()" (save)="saveHomeAddress(homeRow)">
          <mat-form-field editor appearance="outline" subscriptSizing="dynamic">
            <mat-label>Address</mat-label>
            <input matInput name="homeAddress" [(ngModel)]="homeAddressDraft" autocomplete="street-address">
          </mat-form-field>
        </app-setting-row>
      </dl>
    </mat-card-content>
  </mat-card>

  <!-- People: you first, then everyone else in the household, so anyone can configure anyone -->
  <h2 class="section-heading">People</h2>
  <app-pending-day-suggestions></app-pending-day-suggestions>
  <mat-card class="form-card people-card">
    <mat-tab-group class="people-tabs" animationDuration="0ms" mat-align-tabs="start" dynamicHeight>
      <mat-tab *ngFor="let tab of tabs(); trackBy: trackTab">
        <ng-template mat-tab-label>
          <span class="tab-label" [class.tab-label--me]="tab.isMe">{{ tab.label }}</span>
        </ng-template>
        <ng-template matTabContent>
          <div class="tab-body">
            <app-member-settings [memberId]="tab.memberId" [isMe]="tab.isMe"></app-member-settings>
          </div>
        </ng-template>
      </mat-tab>
    </mat-tab-group>
  </mat-card>

  <!-- Household-wide knowledge -->
  <h2 class="section-heading" id="family-memory">Family memory</h2>
  <app-family-memory></app-family-memory>
</div>
