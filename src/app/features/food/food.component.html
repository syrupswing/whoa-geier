<div class="food-container">
  <div class="header">
    <h1>Food</h1>
    <app-global-nav-menu></app-global-nav-menu>
  </div>

  <app-add-button *ngIf="!addsBoth()" (pressed)="addForView()"></app-add-button>
  <app-add-button *ngIf="addsBoth()" [matMenuTriggerFor]="addMenu"></app-add-button>
  <mat-menu #addMenu="matMenu">
    <button mat-menu-item (click)="addRecipe()"><mat-icon>menu_book</mat-icon>Recipe</button>
    <button mat-menu-item (click)="addRestaurant()"><mat-icon>storefront</mat-icon>Restaurant</button>
  </mat-menu>

  <mat-form-field appearance="outline" class="search-field">
    <mat-icon matPrefix>search</mat-icon>
    <mat-label>Search recipes and restaurants</mat-label>
    <input matInput [(ngModel)]="searchTerm" placeholder="Search by name...">
  </mat-form-field>

  <div class="view-chips" role="tablist" aria-label="Show">
    <button
      *ngFor="let v of views"
      type="button"
      role="tab"
      class="view-chip"
      [class.active]="view() === v.value"
      [attr.aria-selected]="view() === v.value"
      (click)="view.set(v.value)">
      <mat-icon>{{ v.icon }}</mat-icon>
      {{ v.label }}
    </button>
  </div>

  <app-recipes *ngIf="showRecipes()" [embedded]="true" [searchTerm]="searchTerm"></app-recipes>
  <app-restaurants *ngIf="showRestaurants()" [embedded]="true" [searchTerm]="searchTerm" [mode]="restaurantMode()"></app-restaurants>
</div>
