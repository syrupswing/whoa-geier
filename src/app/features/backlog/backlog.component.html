<div class="backlog-container">
  <div class="header">
    <h1>Task backlog</h1>
    <app-global-nav-menu></app-global-nav-menu>
  </div>

  <app-add-button label="Add task" (pressed)="openAdd()"></app-add-button>

  <div *ngIf="backlog.isLoading()" class="loading-state">
    <app-loading-animation [size]="40"></app-loading-animation>
  </div>

  <ng-container *ngIf="!backlog.isLoading()">
    <section class="group">
      <div class="group-header">
        <button mat-button type="button" (click)="showUnscheduled.set(!showUnscheduled())" [attr.aria-expanded]="showUnscheduled()">
          <mat-icon>{{ showUnscheduled() ? 'expand_less' : 'expand_more' }}</mat-icon>
          Unscheduled ({{ backlog.open().length }})
        </button>
      </div>
      <ng-container *ngIf="showUnscheduled()">
      <p class="empty" *ngIf="backlog.open().length === 0">Nothing unscheduled. Tap + to add a task.</p>

      <ul class="task-list" *ngIf="backlog.open().length">
        <li *ngFor="let item of backlog.open()" class="task" [attr.data-highlight-id]="item.id">
          <mat-checkbox [checked]="false" (change)="toggle(item)" [attr.aria-label]="'Complete ' + item.title"></mat-checkbox>
          <button type="button" class="task-body" (click)="edit(item)">
            <span class="task-title">{{ item.title }}</span>
            <span class="task-meta" *ngIf="item.notes || item.scope === 'private'">
              <mat-icon *ngIf="item.scope === 'private'" class="meta-icon" aria-label="Private">lock_person</mat-icon>
              <span *ngIf="item.notes" class="notes">{{ item.notes }}</span>
            </span>
          </button>
          <button mat-button type="button" class="schedule-btn" (click)="schedule(item)">
            <mat-icon>event</mat-icon>
            Schedule
          </button>
          <button mat-icon-button type="button" [matMenuTriggerFor]="menu" aria-label="More">
            <mat-icon>more_vert</mat-icon>
          </button>
          <mat-menu #menu="matMenu">
            <button mat-menu-item type="button" (click)="edit(item)"><mat-icon>edit</mat-icon>Edit</button>
            <button mat-menu-item type="button" (click)="schedule(item)"><mat-icon>event</mat-icon>Schedule</button>
            <button mat-menu-item type="button" (click)="remove(item)"><mat-icon>delete</mat-icon>Delete</button>
          </mat-menu>
        </li>
      </ul>

      </ng-container>
    </section>

    <section class="group">
      <div class="group-header">
        <button mat-button type="button" (click)="showScheduled.set(!showScheduled())" [attr.aria-expanded]="showScheduled()">
          <mat-icon>{{ showScheduled() ? 'expand_less' : 'expand_more' }}</mat-icon>
          Scheduled ({{ scheduled().length }})
        </button>
      </div>
      <ng-container *ngIf="showScheduled()">
        <p class="empty" *ngIf="scheduled().length === 0">Nothing scheduled. Tasks you put on the calendar are listed here by date.</p>
        <ul class="task-list" *ngIf="scheduled().length">
          <li *ngFor="let row of scheduled(); trackBy: trackScheduled" class="task" [attr.data-highlight-id]="row.event.id">
            <mat-checkbox [checked]="false" (change)="completeScheduled(row)" [attr.aria-label]="'Complete ' + row.event.summary"></mat-checkbox>
            <button type="button" class="task-body" (click)="editScheduled(row)">
              <span class="task-title">{{ row.event.summary }}</span>
              <span class="task-meta">
                <span class="when" [class.overdue]="row.overdue">{{ row.overdue ? 'Overdue · ' : '' }}{{ row.event.vehicleTask ? 'Due ' : '' }}{{ dateLabel(row) }}</span>
                <span class="notes" *ngIf="deadlineLabel(row) as deadline">{{ deadline }}</span>
                <mat-icon *ngIf="row.event.repeat" class="meta-icon" [attr.aria-label]="repeatText(row)" [title]="repeatText(row)">repeat</mat-icon>
                <mat-icon *ngIf="row.event.vehicleTask" class="meta-icon" aria-label="Vehicle maintenance" title="Vehicle maintenance">directions_car</mat-icon>
                <mat-icon *ngIf="row.event.isPrivate" class="meta-icon" aria-label="Private">lock_person</mat-icon>
              </span>
            </button>
          </li>
        </ul>
      </ng-container>
    </section>

    <section class="group" *ngIf="backlog.done().length">
      <div class="group-header">
        <button mat-button type="button" (click)="showDone.set(!showDone())">
          <mat-icon>{{ showDone() ? 'expand_less' : 'expand_more' }}</mat-icon>
          Completed ({{ backlog.done().length }})
        </button>
        <button mat-button type="button" *ngIf="showDone()" (click)="clearDone()">Clear</button>
      </div>
      <ul class="task-list done" *ngIf="showDone()">
        <li *ngFor="let item of backlog.done()" class="task" [attr.data-highlight-id]="item.id">
          <mat-checkbox [checked]="true" (change)="toggle(item)" [attr.aria-label]="'Mark ' + item.title + ' not done'"></mat-checkbox>
          <span class="task-body static">
            <span class="task-title">{{ item.title }}</span>
            <span class="task-meta" *ngIf="item.completedByName">
              <span class="notes">Done by {{ item.completedByName }}</span>
            </span>
          </span>
          <button mat-icon-button type="button" (click)="remove(item)" aria-label="Delete"><mat-icon>delete</mat-icon></button>
        </li>
      </ul>
    </section>
  </ng-container>
</div>
