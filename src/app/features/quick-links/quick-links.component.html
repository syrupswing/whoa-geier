<div class="quick-links-container">
  <div class="header">
    <app-home-logo-btn></app-home-logo-btn>
    <h1>Quick links</h1>
    <app-global-nav-menu></app-global-nav-menu>
  </div>
  <p class="subtitle">Fast access to family resources and favorite destinations</p>

  <div class="quick-links-section">
    <ng-container *ngFor="let link of quickLinkService.allLinks()">
      <a
        *ngIf="link.isExternal"
        [href]="link.url"
        target="_blank"
        rel="noopener noreferrer"
        class="quick-link-card"
        [class.minecraft-themed]="link.id === 'remi-world'">
        <mat-icon class="quick-link-icon">{{ link.icon }}</mat-icon>
        <div class="quick-link-content">
          <h3 class="quick-link-title">{{ link.title }}</h3>
          <p class="quick-link-subtitle" *ngIf="link.subtitle">{{ link.subtitle }}</p>
        </div>
        <mat-icon class="external-icon">open_in_new</mat-icon>

        <button
          *ngIf="link.isEditable"
          mat-icon-button
          class="edit-link-btn"
          [matMenuTriggerFor]="linkMenu"
          (click)="$event.preventDefault(); $event.stopPropagation()"
          matTooltip="Edit or delete">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #linkMenu="matMenu">
          <button mat-menu-item (click)="openEditQuickLinkDialog(link)">
            <mat-icon>edit</mat-icon>
            <span>Edit Link</span>
          </button>
          <button mat-menu-item (click)="deleteQuickLink(link)">
            <mat-icon>delete</mat-icon>
            <span>Delete Link</span>
          </button>
        </mat-menu>
      </a>

      <a
        *ngIf="!link.isExternal"
        [routerLink]="link.url"
        class="quick-link-card"
        [class.minecraft-themed]="link.id === 'remi-world'">
        <mat-icon class="quick-link-icon">{{ link.icon }}</mat-icon>
        <div class="quick-link-content">
          <h3 class="quick-link-title">{{ link.title }}</h3>
          <p class="quick-link-subtitle" *ngIf="link.subtitle">{{ link.subtitle }}</p>
        </div>

        <button
          *ngIf="link.isEditable"
          mat-icon-button
          class="edit-link-btn"
          [matMenuTriggerFor]="linkMenu2"
          (click)="$event.preventDefault(); $event.stopPropagation()"
          matTooltip="Edit or delete">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #linkMenu2="matMenu">
          <button mat-menu-item (click)="openEditQuickLinkDialog(link)">
            <mat-icon>edit</mat-icon>
            <span>Edit Link</span>
          </button>
          <button mat-menu-item (click)="deleteQuickLink(link)">
            <mat-icon>delete</mat-icon>
            <span>Delete Link</span>
          </button>
        </mat-menu>
      </a>
    </ng-container>

    <button
      class="quick-link-card add-link-card"
      (click)="openAddQuickLinkDialog()">
      <mat-icon class="quick-link-icon add-icon">add_circle</mat-icon>
      <div class="quick-link-content">
        <h3 class="quick-link-title">Add Quick Link</h3>
        <p class="quick-link-subtitle">Create custom link</p>
      </div>
    </button>
  </div>
</div>
